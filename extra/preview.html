<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<title>fruit_vec.json — 재생 확인</title>
<style>
  body{margin:0;background:#0d0b12;color:#e9e2ff;font:14px/1.5 system-ui,sans-serif}
  #wrap{padding:16px}
  #cv{display:block;background:#0d0b12;border:1px solid #332a4a;max-width:100%}
  .row{display:flex;gap:12px;align-items:center;margin:10px 0}
  input[type=range]{width:320px}
  code{color:#b98cff}
</style>
</head>
<body>
<div id="wrap">
  <div class="row">
    <label>frame <input id="fr" type="range" min="0" max="120" value="0"></label>
    <span id="lab">f=0</span>
    <label><input id="face" type="checkbox"> 얼굴 오버레이</label>
  </div>
  <canvas id="cv" width="1080" height="820"></canvas>
  <p><code>fruit_vec.json</code> 을 Path2D로 재생한다. 회전은 <b>프레임 f의 순수 함수</b>(<code>a = f*0.03</code>) —
     슬라이더를 앞뒤로 훑어도 같은 f는 같은 그림이다. <b>정적 서버로 열 것</b>(file:// 은 fetch 차단).</p>
</div>
<script>
const cv = document.getElementById('cv'), g = cv.getContext('2d');
const ORDER = ['cherry','strawberry','grape','persimmon','tangerine','apple','pear','peach','pineapple','melon','watermelonwhole'];
const BODY_FILL = [1.18,1.20,1.16,1.16,1.12,1.14,1.12,1.15,1.20,1.08,1.10];
const FACE_CFG = [{s:0.42,dy:0.30},{s:0.66,dy:0.06},{s:0.60,dy:0.12},{s:0.70,dy:0.16},{s:0.72,dy:0.08},{s:0.72,dy:0.10},
                  {s:0.58,dy:0.20},{s:0.72,dy:0.10},{s:0.60,dy:0.24},{s:0.78,dy:0.06},{s:0.82,dy:0.05}];
let V = null;

function bodyPath(layers){
  const p = new Path2D();
  for(const L of layers) for(const sub of L.subs){
    p.moveTo(sub[0][0], sub[0][1]);
    for(const s of sub) p.bezierCurveTo(s[2],s[3],s[4],s[5],s[6],s[7]);
    p.closePath();
  }
  return p;
}
function drawBody(name, r, fill){
  const layers = V[name]; if(!layers) return;
  g.save(); g.scale(r*fill, r*fill);
  for(const L of layers){ g.fillStyle = L.fill; g.fill(bodyPath([L])); }
  g.restore();
}
function drawFace(r, cfg){
  g.save(); g.scale(cfg.s, cfg.s); g.translate(0, cfg.dy*r);
  const ex = r*0.30, ey = -r*0.02;
  g.fillStyle = 'rgba(255,120,150,0.28)';
  for(const s of [-1,1]){ g.beginPath(); g.ellipse(s*r*0.46, r*0.16, r*0.14, r*0.09, 0, 0, Math.PI*2); g.fill(); }
  for(const s of [-1,1]){
    g.fillStyle = '#3a2b2b';
    g.beginPath(); g.ellipse(s*ex, ey, r*0.085, r*0.12, 0, 0, Math.PI*2); g.fill();
    g.fillStyle = 'rgba(255,255,255,0.9)';
    g.beginPath(); g.arc(s*ex - r*0.03, ey - r*0.045, r*0.035, 0, Math.PI*2); g.fill();
  }
  g.strokeStyle = '#3a2b2b'; g.lineWidth = Math.max(1.4, r*0.045); g.lineCap = 'round';
  g.beginPath(); g.arc(0, r*0.08, r*0.16, Math.PI*0.15, Math.PI*0.85); g.stroke();
  g.restore();
}
function seek(f){
  g.fillStyle = '#0d0b12'; g.fillRect(0,0,cv.width,cv.height);
  const withFace = document.getElementById('face').checked;
  const COLS = 4, CW = cv.width/COLS, CH = 260, R = 88;
  ORDER.forEach((name, i) => {
    const cx = (i%COLS)*CW + CW/2, cy = Math.floor(i/COLS)*CH + CH/2 + 14;
    g.save(); g.translate(cx, cy); g.rotate(f*0.03);
    drawBody(name, R, BODY_FILL[i]);
    g.restore();
    if(withFace){ g.save(); g.translate(cx, cy); drawFace(R, FACE_CFG[i]); g.restore(); }
    g.fillStyle = '#9a8ec4'; g.font = '600 20px system-ui,sans-serif'; g.textAlign = 'center';
    g.fillText(name, cx, cy + CH/2 - 22);
  });
  document.getElementById('lab').textContent = 'f=' + f;
}
document.getElementById('fr').addEventListener('input', e => seek(+e.target.value));
document.getElementById('face').addEventListener('change', () => seek(+document.getElementById('fr').value));
fetch('fruit_vec.json', {cache:'no-store'}).then(r => r.json()).then(d => { V = d; window.__ready = true; seek(0); });
window.__seekF = f => seek(f|0);
</script>
</body>
</html>
